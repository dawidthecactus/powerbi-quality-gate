name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: pbiq-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify version matches tag and comes from main
        id: version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = Get-Content 'src/PowerBIQualityGate.Cli/PowerBIQualityGate.Cli.csproj' -Raw
          $match = [regex]::Match($project, '<Version>(\d+\.\d+\.\d+(?:-[0-9A-Za-z][0-9A-Za-z.-]*)?)</Version>')
          if (-not $match.Success) {
              throw 'CLI project must specify a SemVer <Version> (for example 0.2.0-rc.1).'
          }
          $version = $match.Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
              if ($env:GITHUB_REF_NAME -ne "v$version") {
                  throw "Tag '$env:GITHUB_REF_NAME' does not match CLI version '$version'."
              }
              & git fetch origin main
              if ($LASTEXITCODE -ne 0) { throw 'Could not fetch origin/main.' }
              & git merge-base --is-ancestor $env:GITHUB_SHA origin/main
              if ($LASTEXITCODE -ne 0) { throw 'Release tag must point to a commit reachable from main.' }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Validated release version: $version"

  verify:
    name: Verify (${{ matrix.os }})
    needs: metadata
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build with warnings as errors
        run: dotnet build -c Release --no-restore -warnaserror

      - name: Run tests
        run: dotnet test -c Release --no-build --no-restore

      - name: Verify formatting
        run: dotnet format whitespace --verify-no-changes --no-restore

  package:
    name: Package (${{ matrix.rid }})
    needs: [metadata, verify]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            archive: pbiq-win-x64.zip
          - os: ubuntu-latest
            rid: linux-x64
            archive: pbiq-linux-x64.tar.gz
    env:
      PACKAGE_RID: ${{ matrix.rid }}
      PACKAGE_VERSION: ${{ needs.metadata.outputs.version }}
      PACKAGE_ARCHIVE: ${{ matrix.archive }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish self-contained single-file CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish src/PowerBIQualityGate.Cli/PowerBIQualityGate.Cli.csproj `
              -c Release -r $env:PACKAGE_RID --self-contained true `
              -p:PublishSingleFile=true -p:PublishTrimmed=false `
              -p:DebugType=none -p:Version=$env:PACKAGE_VERSION `
              -o "publish/$env:PACKAGE_RID"
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed.' }

      - name: Build and re-extract distribution archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $publishDir = Join-Path $PWD "publish/$env:PACKAGE_RID"
          $binaryName = if ($IsWindows) { 'pbiq.exe' } else { 'pbiq' }
          $binary = Join-Path $publishDir $binaryName
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw "Missing executable: $binary" }
          if (-not $IsWindows) {
              & chmod +x $binary
              if ($LASTEXITCODE -ne 0) { throw 'chmod failed.' }
          }

          Copy-Item -LiteralPath README.md -Destination $publishDir
          Copy-Item -LiteralPath LICENSE -Destination $publishDir
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $archive = Join-Path $PWD "dist/$env:PACKAGE_ARCHIVE"
          if ($IsWindows) {
              Compress-Archive -Path "$publishDir/*" -DestinationPath $archive -CompressionLevel Optimal
          }
          else {
              & tar -czf $archive -C $publishDir .
              if ($LASTEXITCODE -ne 0) { throw 'tar packaging failed.' }
          }
          if (-not (Test-Path -LiteralPath $archive -PathType Leaf)) { throw 'Archive was not created.' }

          # Test exactly what a user downloads, not only the publish directory.
          $extracted = Join-Path $PWD 'release-extracted'
          New-Item -ItemType Directory -Force -Path $extracted | Out-Null
          if ($IsWindows) {
              Expand-Archive -LiteralPath $archive -DestinationPath $extracted -Force
          }
          else {
              & tar -xzf $archive -C $extracted
              if ($LASTEXITCODE -ne 0) { throw 'Archive extraction failed.' }
          }
          ./scripts/smoke-test-release.ps1 `
              -DistributionDirectory $extracted `
              -ExpectedVersion $env:PACKAGE_VERSION

      - name: Upload distributable
        uses: actions/upload-artifact@v4
        with:
          name: pbiq-${{ matrix.rid }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 7

  checksums:
    name: Verify SHA256 artifacts
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download both archives
        uses: actions/download-artifact@v4
        with:
          pattern: pbiq-*
          path: dist
          merge-multiple: true

      - name: Generate and verify checksums
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/pbiq-win-x64.zip
          test -s dist/pbiq-linux-x64.tar.gz
          (cd dist && sha256sum pbiq-win-x64.zip pbiq-linux-x64.tar.gz > SHA256SUMS.txt)
          (cd dist && sha256sum -c SHA256SUMS.txt)

      - name: Upload checksums for dry-run inspection
        uses: actions/upload-artifact@v4
        with:
          name: pbiq-checksums
          path: dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push'
    needs: [metadata, verify, package, checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download verified packages and SHA256 sums
        uses: actions/download-artifact@v4
        with:
          pattern: pbiq-*
          path: dist
          merge-multiple: true

      - name: Verify release assets again
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS.txt)

      - name: Publish prerelease or stable release
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            dist/pbiq-win-x64.zip \
            dist/pbiq-linux-x64.tar.gz \
            dist/SHA256SUMS.txt \
            --verify-tag \
            "${flags[@]}" \
            --title "Power BI Quality Gate $RELEASE_TAG" \
            --generate-notes
