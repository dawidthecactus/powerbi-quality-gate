name: Docs screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: Capture authentic CLI screenshots (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout public examples and screenshot tapes
        uses: actions/checkout@v7

      - name: Preflight VHS tape syntax (before installing .NET or VHS)
        run: python3 scripts/check-vhs-tapes.py assets/vhs

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build the real CLI
        run: |
          dotnet restore
          dotnet build -c Release --no-restore -warnaserror

      - name: Verify real CLI outputs and exit codes before recording
        shell: bash
        run: |
          set -euo pipefail
          dll='src/PowerBIQualityGate.Cli/bin/Release/net10.0/pbiq.dll'
          verify_case() {
            local label="$1" expected="$2" marker="$3"
            shift 3
            local output exit_code
            set +e
            output="$(dotnet "$dll" "$@" --no-color 2>&1)"
            exit_code=$?
            set -e
            if [[ "$exit_code" -ne "$expected" || "$output" != *"$marker"* ]]; then
              printf 'FAIL %s: expected exit %s and output marker %s, got exit %s\n' \
                "$label" "$expected" "$marker" "$exit_code" >&2
              exit 1
            fi
            printf 'PASS %s: exit %s\n' "$label" "$exit_code"
          }
          verify_case scan 0 'STRUCTURE VALIDATION: PASS' scan examples/valid-pbir-tmdl
          verify_case inspect 0 'Measures inspected: 2/2' inspect examples/valid-pbir-tmdl --measures
          verify_case audit-pass 0 'PASS WITH COVERAGE GAPS' audit examples/valid-pbir-tmdl
          verify_case audit-warning 1 'FAIL (WARNING POLICY)' audit examples/warning-pbir-tmdl --fail-on-warning

      - name: Install VHS terminal recorder
        uses: charmbracelet/vhs-action@v2.1.1
        with:
          path: ''
          version: 'v0.12.1'
          install-fonts: false

      - name: Capture four real terminal frames
        shell: bash
        run: |
          set -euo pipefail
          # Empty NO_COLOR is also interpreted as disabled color by the CLI.
          unset NO_COLOR
          export TERM=xterm-256color
          export COLORTERM=truecolor
          mkdir -p assets/screenshots assets/demos
          vhs validate assets/vhs/*.tape
          for tape in \
            assets/vhs/scan.tape \
            assets/vhs/inspect-measures.tape \
            assets/vhs/audit-summary.tape \
            assets/vhs/audit-warning.tape; do
            echo "Rendering $tape"
            vhs "$tape"
          done
          python3 scripts/verify-terminal-screenshots.py assets/screenshots
          rm -f assets/demos/.capture-*.gif

      - name: Upload screenshots for human review
        uses: actions/upload-artifact@v4
        with:
          name: pbiq-terminal-screenshots
          path: assets/screenshots/*.png
          if-no-files-found: error
          retention-days: 7
