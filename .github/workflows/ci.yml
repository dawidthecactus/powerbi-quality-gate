name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build with warnings as errors
        run: dotnet build -c Release --no-restore -warnaserror

      - name: Run unit tests
        run: dotnet test -c Release --no-build --no-restore

      - name: Audit CLI exit-code contract (Windows and Linux)
        shell: pwsh
        run: |
          $dll = Join-Path (Get-Location).Path 'src/PowerBIQualityGate.Cli/bin/Release/net10.0/pbiq.dll'
          $stdout = Join-Path $env:RUNNER_TEMP 'pbiq-audit-stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'pbiq-audit-stderr.txt'

          $cases = @(
            @{ Name = 'info-only default'; Path = 'examples/valid-pbir-tmdl'; Strict = $false; Expected = 0; Marker = 'PASS WITH COVERAGE GAPS' }
            @{ Name = 'info-only strict'; Path = 'examples/valid-pbir-tmdl'; Strict = $true; Expected = 0; Marker = 'PASS WITH COVERAGE GAPS' }
            @{ Name = 'warning default'; Path = 'examples/warning-pbir-tmdl'; Strict = $false; Expected = 0; Marker = 'PASS WITH COVERAGE GAPS' }
            @{ Name = 'warning strict'; Path = 'examples/warning-pbir-tmdl'; Strict = $true; Expected = 1; Marker = 'FAIL (WARNING POLICY)' }
            @{ Name = 'coverage strict'; Path = 'examples/valid-pbir-tmdl'; Strict = $false; Coverage = 95; Expected = 1; Marker = 'FAIL (COVERAGE POLICY)' }
            @{ Name = 'coverage zero'; Path = 'examples/valid-pbir-tmdl'; Strict = $false; Coverage = 0; Expected = 0; Marker = 'PASS WITH COVERAGE GAPS' }
            @{ Name = 'coverage invalid'; Path = 'examples/valid-pbir-tmdl'; Strict = $false; Coverage = 101; Expected = 2; Marker = 'INVALID COVERAGE THRESHOLD' }
            @{ Name = 'bad PBIP structure'; Path = 'examples/invalid-pbip-shortcut'; Strict = $true; Expected = 1; Marker = 'STRUCTURE VALIDATION FAILED' }
            @{ Name = 'summary with grouped details'; Path = 'examples/valid-pbir-tmdl'; Strict = $false; Details = $true; Expected = 0; Marker = 'FINDINGS BY RULE' }
            @{ Name = 'one-line quiet success'; Path = 'examples/valid-pbir-tmdl'; Strict = $false; Quiet = $true; Expected = 0; Marker = 'PBIQ | AUDIT: PASS WITH COVERAGE GAPS' }
            @{ Name = 'one-line quiet warning failure'; Path = 'examples/warning-pbir-tmdl'; Strict = $true; Quiet = $true; Expected = 1; Marker = 'PBIQ | AUDIT: FAIL (WARNING POLICY)' }
            @{ Name = 'conflicting output modes'; Path = 'examples/valid-pbir-tmdl'; Strict = $false; Quiet = $true; Details = $true; Expected = 2; Marker = 'INVALID OUTPUT MODE' }
            @{ Name = 'missing project'; Path = 'examples/missing-project-does-not-exist'; Strict = $true; Expected = 2; Marker = 'PROJECT DISCOVERY FAILED' }
          )

          foreach ($case in $cases) {
            $arguments = @($dll, 'audit', $case.Path, '--no-color')
            if ($case.Strict) { $arguments += '--fail-on-warning' }
            if ($case.ContainsKey('Details') -and $case.Details) { $arguments += '--details' }
            if ($case.ContainsKey('Quiet') -and $case.Quiet) { $arguments += '--quiet' }
            if ($case.ContainsKey('Coverage')) { $arguments += @('--min-measure-coverage', [string]$case.Coverage) }
            $process = Start-Process -FilePath 'dotnet' -ArgumentList $arguments -Wait -PassThru -NoNewWindow `
              -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $stream = if ($case.Expected -eq 0) { $stdout } else { $stderr }
            $text = Get-Content -LiteralPath $stream -Raw
            if ($process.ExitCode -ne $case.Expected -or -not $text.Contains($case.Marker)) {
              Write-Host "Case failed: $($case.Name); got exit $($process.ExitCode); expected $($case.Expected)"
              Get-Content -LiteralPath $stdout
              Get-Content -LiteralPath $stderr
              throw "PBIQ CLI exit-code smoke test failed: $($case.Name)"
            }
            if ($case.ContainsKey('Quiet') -and $case.Quiet -and
                -not ($case.ContainsKey('Details') -and $case.Details)) {
              $lines = @(Get-Content -LiteralPath $stream)
              if ($lines.Count -ne 1) { throw "Quiet output is not one line: $($case.Name)" }
              if ($text.Contains([char]27)) { throw "Quiet output contains ESC: $($case.Name)" }
            }
            Write-Host "PASS $($case.Name): exit $($process.ExitCode)"
          }

      - name: Measure metadata inventory CLI smoke (Windows and Linux)
        shell: pwsh
        run: |
          $dll = Join-Path (Get-Location).Path 'src/PowerBIQualityGate.Cli/bin/Release/net10.0/pbiq.dll'
          $stdout = Join-Path $env:RUNNER_TEMP 'pbiq-measures-stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'pbiq-measures-stderr.txt'

          # Start-Process captures intentional nonzero exit codes without pwsh
          # treating the native command itself as an unhandled error.
          $cases = @(
            @{ Name = 'measure inventory'; Arguments = @('inspect', 'examples/valid-pbir-tmdl', '--measures', '--no-color'); Expected = 0; Marker = 'Measures inspected: 2/2' }
            @{ Name = 'conflicting inspection modes'; Arguments = @('inspect', 'examples/valid-pbir-tmdl', '--tom', '--measures'); Expected = 2; Marker = 'alternative output modes' }
          )

          foreach ($case in $cases) {
            $arguments = @($dll) + $case.Arguments
            $process = Start-Process -FilePath 'dotnet' -ArgumentList $arguments -Wait -PassThru -NoNewWindow `
              -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $stream = if ($case.Expected -eq 0) { $stdout } else { $stderr }
            $content = Get-Content -LiteralPath $stream -Raw

            if ($process.ExitCode -ne $case.Expected -or -not $content.Contains($case.Marker)) {
              Write-Host "Case failed: $($case.Name); got exit $($process.ExitCode); expected $($case.Expected)"
              Get-Content -LiteralPath $stdout
              Get-Content -LiteralPath $stderr
              throw "Measure inspection CLI smoke test failed: $($case.Name)"
            }

            if ($case.Expected -eq 0) {
              if (-not $content.Contains('Format (visible):') -or
                  -not $content.Contains('Type (visible):')) {
                throw 'Measure inventory did not contain required aggregates.'
              }
              if ($content.Contains([char]27) -or $content.Contains('SUM(')) {
                throw 'Measure inventory exposed ANSI control or an expression.'
              }
            }
            Write-Host "PASS $($case.Name): exit $($process.ExitCode)"
          }

      - name: Measure quality real-world regression (public examples)
        shell: pwsh
        run: |
          ./scripts/validate-measure-quality.ps1 `
            -ProjectPaths @('examples/valid-pbir-tmdl/Example.pbip', 'examples/warning-pbir-tmdl/Example.pbip') `
            -Aliases @('Baseline', 'Warning') `
            -Iterations 2 -Warmups 0 `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'pbiq-measure-validation')

      - name: JSON audit contract smoke (Windows and Linux)
        shell: pwsh
        run: ./scripts/test-audit-json.ps1

      - name: SARIF audit contract smoke (Windows and Linux)
        shell: pwsh
        run: ./scripts/test-audit-sarif.ps1

      - name: Verify formatting
        run: dotnet format whitespace --verify-no-changes --no-restore
