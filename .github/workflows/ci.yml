name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Quality Gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build with warnings as errors
        run: dotnet build -c Release --no-restore -warnaserror

      - name: Run unit tests
        run: dotnet test -c Release --no-build --no-restore

      - name: Audit CLI exit-code contract (Windows and Linux)
        shell: pwsh
        run: |
          $dll = Join-Path (Get-Location).Path 'src/PowerBIQualityGate.Cli/bin/Release/net10.0/pbiq.dll'
          $stdout = Join-Path $env:RUNNER_TEMP 'pbiq-audit-stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'pbiq-audit-stderr.txt'

          $cases = @(
            @{ Name = 'info-only default'; Path = 'examples/valid-pbir-tmdl'; Strict = $false; Expected = 0; Marker = 'PASS WITH COVERAGE GAPS' }
            @{ Name = 'info-only strict'; Path = 'examples/valid-pbir-tmdl'; Strict = $true; Expected = 0; Marker = 'PASS WITH COVERAGE GAPS' }
            @{ Name = 'warning default'; Path = 'examples/warning-pbir-tmdl'; Strict = $false; Expected = 0; Marker = 'PASS WITH COVERAGE GAPS' }
            @{ Name = 'warning strict'; Path = 'examples/warning-pbir-tmdl'; Strict = $true; Expected = 1; Marker = 'FAIL (WARNING POLICY)' }
            @{ Name = 'coverage strict'; Path = 'examples/valid-pbir-tmdl'; Strict = $false; Coverage = 95; Expected = 1; Marker = 'FAIL (COVERAGE POLICY)' }
            @{ Name = 'coverage zero'; Path = 'examples/valid-pbir-tmdl'; Strict = $false; Coverage = 0; Expected = 0; Marker = 'PASS WITH COVERAGE GAPS' }
            @{ Name = 'coverage invalid'; Path = 'examples/valid-pbir-tmdl'; Strict = $false; Coverage = 101; Expected = 2; Marker = 'INVALID COVERAGE THRESHOLD' }
            @{ Name = 'bad PBIP structure'; Path = 'examples/invalid-pbip-shortcut'; Strict = $true; Expected = 1; Marker = 'STRUCTURE VALIDATION FAILED' }
            @{ Name = 'summary with grouped details'; Path = 'examples/valid-pbir-tmdl'; Strict = $false; Details = $true; Expected = 0; Marker = 'FINDINGS BY RULE' }
            @{ Name = 'one-line quiet success'; Path = 'examples/valid-pbir-tmdl'; Strict = $false; Quiet = $true; Expected = 0; Marker = 'PBIQ | AUDIT: PASS WITH COVERAGE GAPS' }
            @{ Name = 'one-line quiet warning failure'; Path = 'examples/warning-pbir-tmdl'; Strict = $true; Quiet = $true; Expected = 1; Marker = 'PBIQ | AUDIT: FAIL (WARNING POLICY)' }
            @{ Name = 'conflicting output modes'; Path = 'examples/valid-pbir-tmdl'; Strict = $false; Quiet = $true; Details = $true; Expected = 2; Marker = 'INVALID OUTPUT MODE' }
            @{ Name = 'missing project'; Path = 'examples/missing-project-does-not-exist'; Strict = $true; Expected = 2; Marker = 'PROJECT DISCOVERY FAILED' }
          )

          foreach ($case in $cases) {
            $arguments = @($dll, 'audit', $case.Path, '--no-color')
            if ($case.Strict) { $arguments += '--fail-on-warning' }
            if ($case.ContainsKey('Details') -and $case.Details) { $arguments += '--details' }
            if ($case.ContainsKey('Quiet') -and $case.Quiet) { $arguments += '--quiet' }
            if ($case.ContainsKey('Coverage')) { $arguments += @('--min-measure-coverage', [string]$case.Coverage) }
            $process = Start-Process -FilePath 'dotnet' -ArgumentList $arguments -Wait -PassThru -NoNewWindow `
              -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $stream = if ($case.Expected -eq 0) { $stdout } else { $stderr }
            $text = Get-Content -LiteralPath $stream -Raw
            if ($process.ExitCode -ne $case.Expected -or -not $text.Contains($case.Marker)) {
              Write-Host "Case failed: $($case.Name); got exit $($process.ExitCode); expected $($case.Expected)"
              Get-Content -LiteralPath $stdout
              Get-Content -LiteralPath $stderr
              throw "PBIQ CLI exit-code smoke test failed: $($case.Name)"
            }
            if ($case.ContainsKey('Quiet') -and $case.Quiet -and
                -not ($case.ContainsKey('Details') -and $case.Details)) {
              $lines = @(Get-Content -LiteralPath $stream)
              if ($lines.Count -ne 1) { throw "Quiet output is not one line: $($case.Name)" }
              if ($text.Contains([char]27)) { throw "Quiet output contains ESC: $($case.Name)" }
            }
            Write-Host "PASS $($case.Name): exit $($process.ExitCode)"
          }

      - name: Measure metadata inventory CLI smoke (Windows and Linux)
        shell: pwsh
        run: |
          $dll = Join-Path (Get-Location).Path 'src/PowerBIQualityGate.Cli/bin/Release/net10.0/pbiq.dll'
          $stdout = Join-Path $env:RUNNER_TEMP 'pbiq-measures-stdout.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'pbiq-measures-stderr.txt'

          # Start-Process captures intentional nonzero exit codes without pwsh
          # treating the native command itself as an unhandled error.
          $cases = @(
            @{ Name = 'measure inventory'; Arguments = @('inspect', 'examples/valid-pbir-tmdl', '--measures', '--no-color'); Expected = 0; Marker = 'Measures inspected: 2/2' }
            @{ Name = 'conflicting inspection modes'; Arguments = @('inspect', 'examples/valid-pbir-tmdl', '--tom', '--measures'); Expected = 2; Marker = 'alternative output modes' }
          )

          foreach ($case in $cases) {
            $arguments = @($dll) + $case.Arguments
            $process = Start-Process -FilePath 'dotnet' -ArgumentList $arguments -Wait -PassThru -NoNewWindow `
              -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $stream = if ($case.Expected -eq 0) { $stdout } else { $stderr }
            $content = Get-Content -LiteralPath $stream -Raw

            if ($process.ExitCode -ne $case.Expected -or -not $content.Contains($case.Marker)) {
              Write-Host "Case failed: $($case.Name); got exit $($process.ExitCode); expected $($case.Expected)"
              Get-Content -LiteralPath $stdout
              Get-Content -LiteralPath $stderr
              throw "Measure inspection CLI smoke test failed: $($case.Name)"
            }

            if ($case.Expected -eq 0) {
              if (-not $content.Contains('Format (visible):') -or
                  -not $content.Contains('Type (visible):')) {
                throw 'Measure inventory did not contain required aggregates.'
              }
              if ($content.Contains([char]27) -or $content.Contains('SUM(')) {
                throw 'Measure inventory exposed ANSI control or an expression.'
              }
            }
            Write-Host "PASS $($case.Name): exit $($process.ExitCode)"
          }

      - name: Measure quality real-world regression (public examples)
        shell: pwsh
        run: |
          ./scripts/validate-measure-quality.ps1 `
            -ProjectPaths @('examples/valid-pbir-tmdl/Example.pbip', 'examples/warning-pbir-tmdl/Example.pbip') `
            -Aliases @('Baseline', 'Warning') `
            -Iterations 2 -Warmups 0 `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP 'pbiq-measure-validation')

      - name: JSON audit contract smoke (Windows and Linux)
        shell: pwsh
        run: ./scripts/test-audit-json.ps1

      - name: SARIF audit contract smoke (Windows and Linux)
        shell: pwsh
        run: ./scripts/test-audit-sarif.ps1

      - name: Verify formatting
        run: dotnet format whitespace --verify-no-changes --no-restore

      # Run the published consumer entrypoint against our real public fixtures
      # on BOTH Ubuntu and Windows. These are action-in-action e2e tests.
      - name: Reusable PBIQ action smoke (pass)
        id: pbiq_pass
        uses: ./
        with:
          project-path: examples/valid-pbir-tmdl
          sarif-output: .pbiq-ci-pass.sarif

      - name: Reusable PBIQ action smoke (expected policy failure)
        id: pbiq_fail
        continue-on-error: true
        uses: ./
        with:
          project-path: examples/warning-pbir-tmdl
          fail-on-warning: 'true'
          sarif-output: .pbiq-ci-fail.sarif

      - name: Reusable PBIQ action smoke (structural failure, not evaluated)
        id: pbiq_invalid
        continue-on-error: true
        uses: ./
        with:
          project-path: examples/invalid-pbip-shortcut
          sarif-output: .pbiq-ci-structural-failure.sarif

      - name: Verify reusable action outputs and policy enforcement
        shell: pwsh
        env:
          PASS_EXIT: ${{ steps.pbiq_pass.outputs.exit-code }}
          PASS_REPORT: ${{ steps.pbiq_pass.outputs.sarif-path }}
          PASS_EVALUATED: ${{ steps.pbiq_pass.outputs.evaluated }}
          FAIL_EXIT: ${{ steps.pbiq_fail.outputs.exit-code }}
          FAIL_REPORT: ${{ steps.pbiq_fail.outputs.sarif-path }}
          FAIL_EVALUATED: ${{ steps.pbiq_fail.outputs.evaluated }}
          FAIL_OUTCOME: ${{ steps.pbiq_fail.outcome }}
          INVALID_EXIT: ${{ steps.pbiq_invalid.outputs.exit-code }}
          INVALID_REPORT: ${{ steps.pbiq_invalid.outputs.sarif-path }}
          INVALID_EVALUATED: ${{ steps.pbiq_invalid.outputs.evaluated }}
          INVALID_OUTCOME: ${{ steps.pbiq_invalid.outcome }}
        run: |
          if ($env:PASS_EXIT -ne '0' -or $env:FAIL_EXIT -ne '1' -or
              $env:INVALID_EXIT -ne '1' -or
              $env:PASS_EVALUATED -ne 'true' -or $env:FAIL_EVALUATED -ne 'true' -or
              $env:INVALID_EVALUATED -ne 'false' -or
              $env:FAIL_OUTCOME -ne 'failure' -or $env:INVALID_OUTCOME -ne 'failure') {
            throw "Reusable action semantics unexpected: pass=$env:PASS_EXIT fail=$env:FAIL_EXIT outcome=$env:FAIL_OUTCOME"
          }
          foreach ($case in @(
            @{ Path = $env:PASS_REPORT; Code = 0; Evaluated = $true }
            @{ Path = $env:FAIL_REPORT; Code = 1; Evaluated = $true }
            @{ Path = $env:INVALID_REPORT; Code = 1; Evaluated = $false }
          )) {
            if (-not $case.Path -or -not (Test-Path -LiteralPath $case.Path -PathType Leaf)) {
              throw 'Reusable action did not leave the expected SARIF file.'
            }
            $sarif = Get-Content -LiteralPath $case.Path -Raw -Encoding utf8 | ConvertFrom-Json -Depth 50
            if ($sarif.version -ne '2.1.0' -or
                $sarif.runs[0].properties.pbiqExitCode -ne $case.Code -or
                $sarif.runs[0].invocations[0].executionSuccessful -ne $case.Evaluated) {
              throw 'Reusable action SARIF outcome is inconsistent.'
            }
          }
          Write-Host 'PASS reusable action: evaluated pass/fail and non-evaluated structural failure are distinct.'

      - name: Verify reusable action source contracts
        run: python scripts/verify-03-5-action.py

      - name: Fabric Git semantic model audit smoke (Windows and Linux)
        shell: pwsh
        run: ./scripts/test-audit-fabric.ps1

      - name: Reusable PBIQ action smoke (Fabric Git item)
        id: pbiq_fabric_pass
        uses: ./
        with:
          project-path: examples/fabric-git/Revenue.SemanticModel
          sarif-output: .pbiq-ci-fabric-pass.sarif

      - name: Reusable PBIQ action smoke (Fabric warning policy)
        id: pbiq_fabric_fail
        continue-on-error: true
        uses: ./
        with:
          project-path: examples/fabric-git-warning/Warning.SemanticModel
          fail-on-warning: 'true'
          sarif-output: .pbiq-ci-fabric-fail.sarif

      - name: Verify Fabric Git action outputs and source paths
        shell: pwsh
        env:
          PASS_EXIT: ${{ steps.pbiq_fabric_pass.outputs.exit-code }}
          PASS_EVALUATED: ${{ steps.pbiq_fabric_pass.outputs.evaluated }}
          PASS_REPORT: ${{ steps.pbiq_fabric_pass.outputs.sarif-path }}
          FAIL_EXIT: ${{ steps.pbiq_fabric_fail.outputs.exit-code }}
          FAIL_EVALUATED: ${{ steps.pbiq_fabric_fail.outputs.evaluated }}
          FAIL_REPORT: ${{ steps.pbiq_fabric_fail.outputs.sarif-path }}
          FAIL_OUTCOME: ${{ steps.pbiq_fabric_fail.outcome }}
        run: |
          if ($env:PASS_EXIT -ne '0' -or $env:FAIL_EXIT -ne '1' -or
              $env:PASS_EVALUATED -ne 'true' -or $env:FAIL_EVALUATED -ne 'true' -or
              $env:FAIL_OUTCOME -ne 'failure') {
            throw "Fabric action contract failed: $env:PASS_EXIT $env:FAIL_EXIT $env:FAIL_OUTCOME"
          }
          foreach ($case in @(
            @{ Path = $env:PASS_REPORT; Code = 0; Prefix = 'examples/fabric-git/' }
            @{ Path = $env:FAIL_REPORT; Code = 1; Prefix = 'examples/fabric-git-warning/' }
          )) {
            if (-not $case.Path -or -not (Test-Path -LiteralPath $case.Path -PathType Leaf)) {
              throw 'Fabric action report missing.'
            }
            $report = Get-Content -LiteralPath $case.Path -Raw -Encoding utf8 | ConvertFrom-Json -Depth 50
            if ($report.version -ne '2.1.0' -or
                $report.runs[0].properties.pbiqExitCode -ne $case.Code) {
              throw 'Fabric SARIF action result is inconsistent.'
            }
            $uris = @($report.runs[0].results | ForEach-Object {
              if (@($_.locations).Count -gt 0) { $_.locations[0].physicalLocation.artifactLocation.uri }
            })
            if ($uris.Count -eq 0 -or -not @($uris | Where-Object {
              $_.StartsWith($case.Prefix)
            }).Count) {
              throw 'Fabric SARIF source locations are not relative to the checkout root.'
            }
          }
          Write-Host 'PASS Fabric Git composite action, SARIF path mapping and policy failure.'

      - name: Verify Fabric Git source contracts
        run: python scripts/verify-03-6-fabric.py

      - name: Verify public documentation and release readiness
        run: |
          python scripts/verify-release-docs.py
          python scripts/verify-03-7-readiness.py

      - name: Real-model pilot harness regression (synthetic data only)
        run: python -m unittest discover -s tests/pilot -p 'test_*.py' -v
